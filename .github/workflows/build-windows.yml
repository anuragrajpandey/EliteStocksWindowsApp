name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Download MPV and dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAURI_BIN_DIR="packages/app/src-tauri/bin"
          mkdir -p "$TAURI_BIN_DIR"

          echo "========================================"
          echo "Downloading MPV"
          echo "========================================"

          MPV_URL=$(gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest \
            --jq '.assets[] | select(.name | test("^mpv-x86_64-[0-9]")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$MPV_URL" ]; then
            echo "ERROR: Could not find MPV x86_64 download."
            exit 1
          fi

          echo "MPV URL: $MPV_URL"

          TEMP_DIR=$(mktemp -d)

          curl -L --fail \
            -o "$TEMP_DIR/mpv.7z" \
            "$MPV_URL"

          echo "Extracting MPV..."

          7z x "$TEMP_DIR/mpv.7z" \
            -o"$TEMP_DIR/mpv-extract" \
            -y

          echo "Installing MPV..."

          cp "$TEMP_DIR/mpv-extract/mpv.exe" \
            "$TAURI_BIN_DIR/mpv-x86_64-pc-windows-msvc.exe"

          cp "$TEMP_DIR/mpv-extract/"*.dll \
            "$TAURI_BIN_DIR/" 2>/dev/null || true

          echo "========================================"
          echo "Downloading Vulkan runtime"
          echo "========================================"

          curl -L --fail \
            -o "$TEMP_DIR/vulkan-runtime.zip" \
            "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"

          7z e "$TEMP_DIR/vulkan-runtime.zip" \
            -o"$TEMP_DIR/vulkan-extract" \
            "*/x64/vulkan-1.dll" \
            -y

          cp "$TEMP_DIR/vulkan-extract/vulkan-1.dll" \
            "$TAURI_BIN_DIR/vulkan-1.dll"

          echo "Creating VulkanRT-License.txt..."

          cat > "$TAURI_BIN_DIR/VulkanRT-License.txt" <<'EOF'
Vulkan Runtime License

This application includes Vulkan Runtime components.
Vulkan Runtime components are distributed by LunarG, Inc.
Please refer to the Vulkan SDK license terms for licensing information.
EOF

          echo "========================================"
          echo "Downloading yt-dlp"
          echo "========================================"

          curl -L --fail \
            -o "$TAURI_BIN_DIR/yt-dlp-x86_64-pc-windows-msvc.exe" \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

          echo "========================================"
          echo "MPV dependencies complete"
          echo "========================================"

          ls -lh "$TAURI_BIN_DIR"

      - name: Download FFmpeg
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Downloading FFmpeg"
          echo "========================================"

          cd packages/app

          node scripts/download-ffmpeg.js

          cd ../..

          echo "========================================"
          echo "Checking Tauri binaries"
          echo "========================================"

          ls -lh packages/app/src-tauri/bin/

      - name: Verify required Tauri files
        shell: bash
        run: |
          set -e

          BIN_DIR="packages/app/src-tauri/bin"

          echo "Checking required files..."

          test -f "$BIN_DIR/mpv-x86_64-pc-windows-msvc.exe"
          test -f "$BIN_DIR/ffmpeg-x86_64-pc-windows-msvc.exe"
          test -f "$BIN_DIR/yt-dlp-x86_64-pc-windows-msvc.exe"
          test -f "$BIN_DIR/vulkan-1.dll"
          test -f "$BIN_DIR/VulkanRT-License.txt"

          echo ""
          echo "========================================"
          echo "ALL REQUIRED FILES FOUND!"
          echo "========================================"

          ls -lh "$BIN_DIR"

      - name: Build Windows app
        run: pnpm tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: |
            **/target/release/bundle/**/*.exe
            **/target/release/bundle/**/*.msi
